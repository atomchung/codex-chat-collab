name: Review process issue
description: Record a sanitized failure, recurring pattern, or improvement from a review loop.
title: "[review] "
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not include holdings, trades, unpublished strategies, personal data, credentials, private repository or PR links, internal file paths, or raw screenshots/transcripts. Generalize or omit anything sensitive.
  - type: input
    id: date
    attributes:
      label: Date found
      description: Use YYYY-MM-DD.
      placeholder: "2026-09-24"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Review loop stage
      options:
        - Planning and scope
        - Finding quality
        - Independent verification
        - Fix and re-review
        - Merge and release
        - Product or UI acceptance
        - Other
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Sanitized observation
      description: State what happened using only details needed to understand the process issue.
      placeholder: Separate observed facts from assumptions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and recurrence
      description: What did this cost or obscure? Link a related public issue if this recurred.
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Cause and confidence
      description: Mark unverified causes as hypotheses.
  - type: textarea
    id: action
    attributes:
      label: Proposed or completed action
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: Verification status
      options:
        - Not fixed
        - Fixed, not verified
        - Verified locally
        - Verified in the reviewed runtime
        - Needs private follow-up; details omitted
    validations:
      required: true
